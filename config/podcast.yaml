# Datos del podcast para el feed RSS, Apple Podcasts, Spotify y la web.

titulo: Cátodo
subtitulo: Tecnología cada mañana          # pendiente de confirmar
descripcion: >-
  Cátodo es un podcast diario de noticias de tecnología en español, de lunes a
  viernes, en unos diez o quince minutos. Lo que importa de la tecnología, contado
  con calma, con un punto de escepticismo y algo de humor. Solo cuenta noticias
  publicadas por al menos dos grupos editoriales independientes y enlaza siempre
  las fuentes. Guion y voz generados con inteligencia artificial (Claude y Gemini)
  y revisados por personas, que escuchan cada episodio y corrigen lo que haga falta.
aviso_ia: >-
  Guion y voz generados con inteligencia artificial (Claude y Gemini) y revisados
  por personas, que escuchan cada episodio y corrigen lo que haga falta.
  Si ves un error, escríbenos desde https://catodo.es/#contacto.
autor: Cátodo
email: hola@catodo.es
idioma: es-ES
categoria: Technology                      # categoría de Apple Podcasts (en inglés)
subcategoria: Tech News
explicito: false
web: https://catodo.es
imagen: https://catodo.es/portada.jpg      # 3000x3000 px, pendiente
copyright: Cátodo

# Dónde escucharlo: insignias bajo la descripción de la web y en cada episodio.
# Apple va primero (lo piden sus normas de marca). Sin insignia, sale un botón de texto.
escuchar:
  - nombre: Apple Podcasts
    url: https://podcasts.apple.com/es/podcast/c%C3%A1todo/id6838674796
    insignia: /insignias/apple-podcasts.svg   # oficial, sin tocar (toolbox.marketingtools.apple.com)
  - nombre: Spotify
    url: https://open.spotify.com/show/0yoPeeD7SrWdvm9FAcuWf4
    insignia: /insignias/spotify.svg          # su icono oficial, con el formato de la de Apple (assets/insignias/generar.py)
  - nombre: Feed RSS
    url: /feed.xml
    insignia: /insignias/rss.svg
    texto: Suscríbete por RSS

# Perfiles en redes: un icono por cada uno en el pie de la web (assets/redes/iconos/<icono>.svg).
# Solo los que ya se pueden enlazar en público; los demás, comentados hasta que estén listos.
redes:
  - nombre: Bluesky
    url: https://bsky.app/profile/catodo.es
    icono: bluesky
  - nombre: Threads
    url: https://www.threads.com/@catodo.es
    icono: threads
  - nombre: Facebook
    url: https://www.facebook.com/profile.php?id=61596923822721   # la URL pública, no el ID de la Graph API
    icono: facebook
  - nombre: Instagram
    url: https://www.instagram.com/catodo.es/
    icono: instagram
  - nombre: YouTube
    url: https://www.youtube.com/@catodo_es   # @catodo y @catodo.es estaban cogidos
    icono: youtube

# Formulario de contacto del pie: los mensajes llegan a `email` sin publicar la dirección en la web.
# Los envía Web3Forms (gratis hasta 250 al mes). La clave se saca en web3forms.com poniendo
# hola@catodo.es; es pública por diseño: solo sirve para mandar mensajes a ese correo.
# Sin clave, el pie vuelve a enseñar el correo con un mailto.
contacto:
  web3forms: e50ea0a5-ab8f-4b61-95c8-f5dfff5bb73b   # formulario «Cátodo · contacto web» (cuenta hola@catodo.es)
  asuntos:             # el primero va marcado; la pista es el texto de ejemplo del mensaje
    - texto: Un error en un episodio
      pista: Qué episodio y qué está mal. Si sabes el minuto, mejor.
    - texto: Una noticia o una sugerencia
      pista: Qué noticia, qué echas en falta o qué cambiarías.
    - texto: Prensa o colaboraciones
      pista: Quién eres y qué propones.
    - texto: Otro tema
      pista: Cuéntanos.
