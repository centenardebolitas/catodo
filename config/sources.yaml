# Fuentes de noticias de Cátodo.
#
# grupo: grupo editorial propietario. Una noticia solo entra en el episodio si la
#        cubren al menos dos grupos independientes (ver catodo-proyecto.md).
# agregador: true si la fuente solo enlaza a otros medios (Techmeme, Hacker News,
#        Google News, Slashdot). tipo_agregador dice dónde está el enlace original:
#        enlace_directo, enlace_en_resumen o google_news.
#        No cuenta como cobertura propia: cuenta el medio original al que enlaza,
#        cuyo grupo se deduce de su dominio (ver grupos_por_dominio más abajo).
# dominios: dominios web del medio, para reconocer sus artículos cuando llegan
#        a través de un agregador.
# peso: importancia relativa de la fuente al ordenar (1 = normal).
# activa: false para desactivarla sin borrarla.
# leer_con_ia: false si el medio no quiere que una IA lea sus artículos (robots.txt,
#        TDMRep o sus condiciones). Sigue contando para la regla de dos grupos y se
#        enlaza en las notas, pero la redacción y la verificación no abren sus
#        artículos. src/reservas.py lo comprueba también de forma automática.

# Lista ampliada y activada el 23 de noviembre de 2026. Los grupos marcados
# «por confirmar» hay que verificarlos.

