# Ajustes generales de Cátodo. Nada de esto debe estar fijo en el código.

episodio:
  duracion_objetivo_min: 12        # minutos
  palabras_min: 1500
  palabras_max: 2000
  noticias_min: 5
  noticias_max: 6

noticias:
  horas_atras: 24                  # ventana de recogida de feeds
  candidatas: 20                   # cuántas pasan a news.json (el editor elige entre ellas)
  grupos_minimos: 2                # grupos editoriales independientes por noticia
  agrupacion: claude               # claude | estadistico (respaldo sin IA)
  umbral_similitud: 0.15           # 0-1: cuánto se tienen que parecer dos titulares para ser la misma noticia
  umbral_tema: 0.13                # 0-1: segunda pasada que une enfoques distintos de la misma historia
  excluir_si_contiene:             # titulares que no son noticias (ofertas, cupones...)
    - chollo
    - ofertas
    - oferta del día
    - descuento
    - rebajas
    - cupón
    - black friday
    - cyber monday
    - "% off"
    - " deals"
    - deal of the day
    - "save $"
    - "save up to"
  pesos:                           # cómo se ordenan las candidatas
    por_grupo: 3                   # cada grupo editorial que la cubre
    por_fuente: 1                  # cada fuente nuestra (no agregador) que la publica
    techmeme: 2                    # si sale en Techmeme (señal de relevancia)
    hacker_news: 2                 # máximo, según los puntos en Hacker News

claude:                            # llamadas a `claude -p` con la suscripción de Claude
  modelo_agrupar: opus
  esfuerzo_agrupar: medium
  modelo_guion: opus               # editor, redacción, verificación, crítica y versión final
  esfuerzo_guion: high
  tiempo_max_pasada_s: 1800

memoria:
  dias: 7                          # cuántos días atrás recuerda Cátodo
  dias_pendientes: 3               # una noticia pendiente caduca a los N días

tts:
  proveedor: gemini
  via: agent_platform              # agent_platform (Google Cloud, factura directa) | gemini_api (AI Studio)
  proyecto_gcp: gen-lang-client-0764736820   # proyecto «catodo» en Google Cloud
  region: eu                       # eu | us | global (Agent Platform)
  modelo: gemini-3.8-flash-tts
  voz: es-es-csagent-3             # Call Center Agent 3: castellano, 32 años
  estilo_modo: prefijo             # con estilo | ninguno (en Agent Platform va en su campo propio)
  estilo: >-
    Habla en español de España, con acento castellano peninsular.
    Tono cálido, cercano y simpático, como el presentador de un podcast
    matinal de tecnología. Ritmo pausado y tranquilo, sin prisa: deja
    respirar las frases y haz una pausa breve después de cada punto, como
    quien lo cuenta tomando un café. Con algo de humor; nada de locutor
    de telediario.

audio:
  loudness_lufs: -16
  bitrate_kbps: 96
  canales: 1                       # mono
  tempo_voz: 1.0                   # ralentiza la voz al mezclar (0.9 = un 10 % más lenta); descartado el 25-11-2026: se prefiere el estilo pausado
  respiraciones_db: 12             # cuánto se bajan las inspiraciones de la voz (src/respiraciones.py); 0 = como salen

portada:                           # portada de cada episodio: el guion en emojis (src/portada_episodio.py)
  columnas: 20                     # rejilla fija de columnas x columnas casillas; los emojis no cambian de tamaño
  marca: [9, 3]                    # casillas (ancho, alto) reservadas abajo a la derecha para «Cátodo.»
  emojis_objetivo: 350             # cuántos pide Claude en la pasada final (caben unos 370 con los huecos)
  lado_web_px: 600                 # versión ligera para la web

redes:                             # difusión en redes del episodio publicado (src/redes.py, trabajo catodo.difundir de ops)
  activas: []                      # bluesky, instagram, facebook, threads, youtube; vacío = no se publica nada
  version_graph: v24.0             # versión de la Graph API de Meta (Instagram y Facebook)
