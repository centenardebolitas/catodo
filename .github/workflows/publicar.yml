# Pasa a main el episodio que `make programar` (o «Aprobar y programar» del flujo anterior)
# dejó en la rama `programado`, y pide a GitHub Pages que regenere la web y el feed.
#
# Solo a mano (Actions › Publicar episodio programado › Run workflow). Hasta el 26 de
# noviembre de 2026 corría solo a las 6:00 y lo vigilaba ops (catodo.publicar); desde
# entonces el episodio lo publica catodo.preparar en ops al terminar, y ese es el único
# trabajo de Cátodo en ops.

name: Publicar episodio programado

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pasar la rama programada a main
        id: fusion
        run: |
          if ! git ls-remote --exit-code --heads origin programado >/dev/null; then
            echo "No hay ningún episodio programado."
            echo "publicado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin programado main
          if git merge-base --is-ancestor origin/programado origin/main; then
            echo "El episodio programado ya está publicado."
            echo "publicado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/programado; then
            echo "::error::La rama programado no parte del último main. Vuelve a ejecutar make programar."
            exit 1
          fi
          git push origin origin/programado:refs/heads/main
          echo "Publicado: $(git log -1 --format=%s origin/programado)"
          echo "publicado=si" >> "$GITHUB_OUTPUT"

      - name: Regenerar GitHub Pages
        if: steps.fusion.outputs.publicado == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
