<head>

<style>

    :root { --fondo: #141413; --texto: #ecece8; --suave: #9a9a94; --acento: #fb923c; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--fondo); color: var(--texto);
         font-family: system-ui, -apple-system, sans-serif; padding: 0 16px; }
  main { max-width: 560px; }
  h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--acento); }
  p { color: var(--suave); font-size: 1.1rem; line-height: 1.5; }
  .nota { font-size: 0.9rem; }
  footer { margin-top: 32px; font-size: 0.85rem; }
  footer a { color: var(--suave); }
</style>
</head>

  <h1>Cátodo<span>.</span></h1>
